# .github/workflows/main.yml

name: Daily Task2

on:
  schedule:
    - cron: "50 23 * * *"  # UTC 기준. 한국시간 오전 8시 50분
  workflow_dispatch:

jobs:
  login-task:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Chrome for Testing + ChromeDriver
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip jq

        # 최신 Stable Chrome for Testing 버전 가져오기
        CFT_VERSION=$(curl -s \
          "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json" \
          | jq -r '.channels.Stable.version')

        echo "Using Chrome for Testing version: $CFT_VERSION"

        # 다운로드 URL
        CFT_CHROME_URL="https://storage.googleapis.com/chrome-for-testing-public/${CFT_VERSION}/linux64/chrome-linux64.zip"
        CFT_DRIVER_URL="https://storage.googleapis.com/chrome-for-testing-public/${CFT_VERSION}/linux64/chromedriver-linux64.zip"

        echo "Chrome URL: $CFT_CHROME_URL"
        echo "Driver URL: $CFT_DRIVER_URL"

        # 다운로드
        wget -q -O chrome.zip "$CFT_CHROME_URL"
        wget -q -O driver.zip "$CFT_DRIVER_URL"

        # 압축 해제
        unzip -q chrome.zip
        unzip -q driver.zip

        # 설치
        sudo mv chrome-linux64 /usr/local/share/chrome
        sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
        sudo chmod +x /usr/local/bin/chromedriver

        # 정리
        rm chrome.zip driver.zip
        rm -rf chromedriver-linux64

        echo "Installed Chrome:"
        /usr/local/share/chrome/chrome --version
        echo "Installed ChromeDriver:"
        chromedriver --version

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Python script
      env:
        LOGIN_ID: ${{ secrets.MY_ID }}
        LOGIN_PASSWORD: ${{ secrets.MY_PASSWORD }}
        LOGIN_URL: ${{ secrets.MY_LOGIN_URL }}
        SLACK_URL: ${{ secrets.MY_SLACK_URL }}
        BASE_URL: ${{ secrets.MY_BASE_URL }}
        KAKAO_ACCESS_TOKEN: ${{ secrets.MY_KAKAO_ACCESS_TOKEN }}
      run: python main2.py
      continue-on-error: true
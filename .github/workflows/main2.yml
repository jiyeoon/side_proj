# .github/workflows/main.yml

name: Daily Task2

on:
  schedule:
    - cron: "50 23 * * *"  # UTC 기준. 한국시간 오전 8시 50분
  workflow_dispatch:

jobs:
  login-task:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Chrome for Testing + ChromeDriver
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip jq

        # Chrome과 ChromeDriver 버전 114로 고정
        CHROME_VERSION="114.0.5735.90"
        CHROMEDRIVER_VERSION="114.0.5735.90"
        echo "Using Chrome version: $CHROME_VERSION"
        echo "Using ChromeDriver version: $CHROMEDRIVER_VERSION"

        # Chrome 114 다운로드 (Chrome for Testing)
        CHROME_URL="https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chrome-linux64.zip"
        echo "Chrome URL: $CHROME_URL"
        wget -q -O chrome.zip "$CHROME_URL"

        # 일반 ChromeDriver 저장소에서 다운로드
        CHROMEDRIVER_URL="https://chromedriver.storage.googleapis.com/${CHROMEDRIVER_VERSION}/chromedriver_linux64.zip"
        echo "ChromeDriver URL: $CHROMEDRIVER_URL"
        wget -q -O chromedriver.zip "$CHROMEDRIVER_URL"

        # Chrome 압축 해제 및 설치
        unzip -q chrome.zip
        sudo mv chrome-linux64 /usr/local/share/chrome
        sudo chmod +x /usr/local/share/chrome/chrome
        rm -rf chrome.zip chrome-linux64

        # ChromeDriver 압축 해제 및 설치
        unzip -q chromedriver.zip
        sudo mv chromedriver /usr/local/bin/ || sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
        sudo chmod +x /usr/local/bin/chromedriver

        # 정리
        rm -rf chromedriver.zip chromedriver-linux64

        echo "Installed Chrome:"
        /usr/local/share/chrome/chrome --version
        echo "Installed ChromeDriver:"
        chromedriver --version

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Python script
      env:
        LOGIN_ID: ${{ secrets.MY_ID }}
        LOGIN_PASSWORD: ${{ secrets.MY_PASSWORD }}
        LOGIN_URL: ${{ secrets.MY_LOGIN_URL }}
        SLACK_URL: ${{ secrets.MY_SLACK_URL }}
        BASE_URL: ${{ secrets.MY_BASE_URL }}
        KAKAO_ACCESS_TOKEN: ${{ secrets.MY_KAKAO_ACCESS_TOKEN }}
      run: python main2.py
      continue-on-error: true
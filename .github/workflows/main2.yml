# .github/workflows/main.yml

name: Daily Task2

on:
  schedule:
    - cron: "50 23 * * *"  # UTC 기준. 한국시간 오전 8시 50분
  workflow_dispatch:

jobs:
  login-task:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Chrome for Testing + ChromeDriver
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip jq

        # 로컬에서 잘 작동하는 버전으로 고정 (114.0.5735.90)
        # Chrome for Testing에는 없을 수 있으므로 일반 ChromeDriver 다운로드 URL 사용
        CHROMEDRIVER_VERSION="114.0.5735.90"
        echo "Using ChromeDriver version: $CHROMEDRIVER_VERSION (stable working version)"

        # ChromeDriver 다운로드 (일반 ChromeDriver 저장소 사용)
        CHROMEDRIVER_URL="https://chromedriver.storage.googleapis.com/${CHROMEDRIVER_VERSION}/chromedriver_linux64.zip"
        echo "ChromeDriver URL: $CHROMEDRIVER_URL"
        
        # 다운로드 시도
        if ! wget -q -O chromedriver.zip "$CHROMEDRIVER_URL"; then
          echo "ChromeDriver 114.0.5735.90 not found, trying alternative..."
          # 대안: 114 버전대의 다른 버전 시도
          CHROMEDRIVER_VERSION="114.0.5735.16"
          CHROMEDRIVER_URL="https://chromedriver.storage.googleapis.com/${CHROMEDRIVER_VERSION}/chromedriver_linux64.zip"
          wget -q -O chromedriver.zip "$CHROMEDRIVER_URL"
        fi
        
        # Chrome은 일반 Chrome 설치 (버전 호환)
        wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt install -y ./google-chrome-stable_current_amd64.deb
        rm -f google-chrome-stable_current_amd64.deb

        # ChromeDriver 압축 해제 및 설치
        unzip -q chromedriver.zip
        sudo mv chromedriver /usr/local/bin/ || sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
        sudo chmod +x /usr/local/bin/chromedriver

        # 정리
        rm -rf chromedriver.zip chromedriver-linux64

        echo "Installed Chrome:"
        google-chrome --version
        echo "Installed ChromeDriver:"
        chromedriver --version

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Python script
      env:
        LOGIN_ID: ${{ secrets.MY_ID }}
        LOGIN_PASSWORD: ${{ secrets.MY_PASSWORD }}
        LOGIN_URL: ${{ secrets.MY_LOGIN_URL }}
        SLACK_URL: ${{ secrets.MY_SLACK_URL }}
        BASE_URL: ${{ secrets.MY_BASE_URL }}
        KAKAO_ACCESS_TOKEN: ${{ secrets.MY_KAKAO_ACCESS_TOKEN }}
      run: python main2.py
      continue-on-error: true